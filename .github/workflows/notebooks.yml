name: Validate notebooks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebooks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [foundations, core, neural, image-training, special]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements*.lock
      - uses: actions/setup-java@v6
        if: matrix.group == 'special'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install lightweight dependencies
        if: matrix.group == 'foundations'
        run: python -m pip install --require-hashes -r requirements-tabular-linux.lock
      - name: Install neural dependencies
        if: matrix.group == 'neural' || matrix.group == 'image-training'
        run: python -m pip install --require-hashes -r requirements-neural-linux.lock
      - name: Install full optional stack
        if: matrix.group == 'core' || matrix.group == 'special'
        run: python -m pip install --require-hashes -r requirements-full-linux.lock
      - name: Cache checked public assets
        uses: actions/cache@v6.1.0
        with:
          path: |
            validation/cache/
            validation/assets/
          key: public-assets-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('assets/manifest.json') }}
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Validate notebook structure and syntax
        run: python scripts/check_notebooks.py --validate-only --output-dir validation/structure
      - name: Numerical regression tests
        if: matrix.group == 'core'
        run: python -m pytest -q
      - name: Check worked mathematics and documentation links
        if: matrix.group == 'core'
        run: |
          python scripts/check_worked_examples.py
          python scripts/check_links.py
      - name: Verify lightweight profile
        if: matrix.group == 'foundations'
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('torch') is None; assert importlib.util.find_spec('tensorflow') is None"
      - name: Execute notebooks
        run: python scripts/check_notebooks.py --group ${{ matrix.group }} --output-dir validation/executed
      - name: Save execution results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebooks-${{ matrix.group }}
          path: |
            validation/executed/
            validation/structure/results.json
          if-no-files-found: warn
          retention-days: 30
